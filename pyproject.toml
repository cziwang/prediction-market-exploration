[project]
name = "pm"
version = "0.1.0"
description = "NBA prediction market trading infrastructure (Kappa pipeline: replay, normalize, enrich)"
requires-python = ">=3.11,<3.13"  # ceiling from apache-flink (PyFlink supports <= 3.12)
dependencies = [
    "pydantic>=2.7",
    "confluent-kafka>=2.4",
    "boto3>=1.34",
    "clickhouse-connect>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
    "boto3-stubs[s3]>=1.34",
]
flink = [
    "apache-flink==1.20.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires running Kafka (docker compose up); skipped by default",
]
addopts = "-m 'not integration'"

[tool.mypy]
strict = true
files = ["src"]

# pyflink ships no py.typed marker, so mypy refuses its types (PEP 561).
[[tool.mypy.overrides]]
module = "pyflink.*"
ignore_missing_imports = true

# confluent_kafka re-exports C-extension symbols (e.g. admin.NewTopic) without
# declaring them in __all__; treat its re-exports as intentional.
[[tool.mypy.overrides]]
module = "confluent_kafka.*"
implicit_reexport = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
