[project]
name = "pm"
version = "0.1.0"
description = "NBA prediction market trading infrastructure (Kappa pipeline: replay, normalize, enrich)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "confluent-kafka>=2.4",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires running Kafka (docker compose up); skipped by default",
]
addopts = "-m 'not integration'"

[tool.mypy]
strict = true
files = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
